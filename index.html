<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Dashboard</title>
<meta name="theme-color" content="#4a148c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f0f8;
  color: #2d2d2d;
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%);
  color: white;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 10px rgba(74,20,140,0.35);
}
header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.2px; }
header .sub { font-size: 0.78rem; opacity: 0.72; margin-top: 3px; }
.refresh-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.35);
  color: white;
  padding: 7px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: background 0.2s;
  white-space: nowrap;
}
.refresh-btn:hover { background: rgba(255,255,255,0.25); }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

/* ── Stats cards ──────────────────────────────────── */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.card .lbl {
  font-size: 0.68rem;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin-bottom: 6px;
}
.card .val {
  font-size: 2rem;
  font-weight: 700;
  color: #4a148c;
  line-height: 1;
}
.card .hint { font-size: 0.75rem; color: #888; margin-top: 5px; }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.76rem;
  font-weight: 600;
  margin-top: 6px;
}
.menstrual  { background: #fce4ec; color: #b71c1c; }
.follicular { background: #e3f2fd; color: #0d47a1; }
.ovulation  { background: #e8f5e9; color: #1b5e20; }
.luteal     { background: #fff8e1; color: #e65100; }

.card-safe   { border-top: 4px solid #2e7d32; }
.card-unsafe { border-top: 4px solid #c62828; }
.card-caution { border-top: 4px solid #e65100; }
.card-unknown { border-top: 4px solid #9e9e9e; }
.status-safe    { color: #2e7d32; }
.status-unsafe  { color: #c62828; }
.status-caution { color: #e65100; }
.status-unknown { color: #9e9e9e; }

/* ── Staleness / data-quality banner ─────────────── */
.banner {
  position: relative;
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-left: 4px solid #e65100;
  border-radius: 12px;
  padding: 14px 46px 14px 16px;
  margin-bottom: 16px;
  font-size: 0.88rem;
  line-height: 1.45;
  color: #5d4037;
}
.banner div + div { margin-top: 7px; }
/* The unsent-queue banner. Same shape, no close button: it is not a notice,
   it is the state of work that has not landed, and it goes when the queue does. */
.banner.queue {
  background: #fff3e0;
  border-color: #ffcc80;
  border-left-color: #bf360c;
  padding-right: 16px;
  color: #4e342e;
}
.banner.queue .qbtn {
  margin: 10px 8px 0 0;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #bf360c;
  background: white;
  color: #bf360c;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.banner.queue .qbtn:disabled { opacity: 0.5; }
.banner.queue .qbtn.discard { border-color: #8d6e63; color: #8d6e63; font-weight: 400; }
.banner-x {
  position: absolute;
  top: 6px;
  right: 8px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.4rem;
  line-height: 1;
  color: #8d6e63;
  padding: 4px 9px;
}

/* ── Section cards ────────────────────────────────── */
.section {
  background: white;
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}
.section h2 {
  font-size: 0.78rem;
  font-weight: 700;
  color: #7b1fa2;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 14px;
}

/* ── Moon ─────────────────────────────────────────── */
.moon      { font-size: 1.05rem; line-height: 1; margin-right: 6px; cursor: help; }
.moon-name { white-space: nowrap; }

/* ── Chart ────────────────────────────────────────── */
.chart-wrap { position: relative; height: 270px; }
.chart-missing { display: flex; align-items: center; justify-content: center; height: 270px;
  color: #8a7a95; font-size: 0.9rem; text-align: center; padding: 0 20px;
  background: #faf7fc; border: 1px dashed #d6c8de; border-radius: 8px; }

.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; color: #666; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dash-line { width: 18px; height: 2px; flex-shrink: 0; }

/* ── Tables ───────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
thead th {
  text-align: left;
  padding: 8px 10px;
  background: #f5f0f8;
  color: #7b1fa2;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-weight: 700;
  white-space: nowrap;
}
tbody td { padding: 7px 10px; border-bottom: 1px solid #f0eef5; vertical-align: top; white-space: nowrap; }
tbody td.wrap { white-space: normal; }
tbody tr:last-child td { border-bottom: none; }
tbody tr            { background: #fff; }   /* so a sticky cell has a colour to inherit */
tbody tr.row-blood    { background: #fff5f8; }
tbody tr.row-ovul     { background: #f5fff6; }
tbody tr.row-empty    { opacity: 0.38; }
tbody tr.row-current  { background: #faf5fd; }
tfoot td {
  padding: 8px 10px;
  border-top: 2px solid #e8e0ef;
  font-weight: 600;
  color: #7b1fa2;
  white-space: nowrap;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 0.7rem;
  font-weight: 600;
}
.tag-blood { background: #fce4ec; color: #b71c1c; }
.tag-ovul  { background: #e8f5e9; color: #1b5e20; }
.tag-current { background: #f3e5f5; color: #6a1b9a; margin-left: 6px; }

/* ── Footer ───────────────────────────────────────── */
.footer { text-align: center; font-size: 0.7rem; color: #bbb; padding: 10px 0 24px; }

/* ── Loading / error ──────────────────────────────── */
.spinner { text-align: center; padding: 70px 20px; color: #aaa; font-size: 0.9rem; line-height: 1.8; }
.spinner button {
  margin-top: 12px;
  padding: 8px 22px;
  background: #7b1fa2;
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
}

/* ── Overlay controls ─────────────────────────────── */
.overlay-controls {
  display: flex;
  align-items: center;
  margin-bottom: 14px;
}
.trim-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  color: #666;
  cursor: pointer;
  margin-left: auto;
  white-space: nowrap;
}

/* ── Log section header ───────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-header h2 { margin-bottom: 0; }
.cycle-select {
  font-size: 0.8rem;
  padding: 5px 10px;
  border: 1px solid #d1c4e9;
  border-radius: 8px;
  color: #4a148c;
  background: white;
  cursor: pointer;
  outline: none;
}

/* ── Tabs (writer only) ─────────────────── */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab {
  flex: 1;
  padding: 12px 10px;
  border: 1px solid #d1c4e9;
  background: white;
  color: #7b1fa2;
  border-radius: 10px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
}
.tab.on { background: #7b1fa2; border-color: #7b1fa2; color: white; }

/* ── Catch-up entry list ──────────────── */
.day-card { border: 1px solid #ede7f6; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.day-card.open { border-color: #b39ddb; box-shadow: 0 1px 8px rgba(74,20,140,0.12); }
.day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  background: white;
  border: none;
  text-align: left;
  cursor: pointer;
  font-size: 0.9rem;
  color: #2d2d2d;
}
.day-card.open .day-head { background: #faf5fd; }
.day-when { font-weight: 600; white-space: nowrap; }
.day-sum { color: #888; font-size: 0.8rem; text-align: right; }
.day-sum .unsent { display: block; color: #bf360c; font-weight: 600; }
.day-card.unlogged .day-sum { color: #bbb; font-style: italic; }
.day-body { padding: 4px 14px 16px; border-top: 1px solid #ede7f6; }
.fld { margin-top: 12px; }
.fld > label { display: block; font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.5px; color: #999; margin-bottom: 5px; }
.fld input, .fld select, .fld textarea {
  width: 100%;
  padding: 11px 12px;
  font-size: 1rem;
  font-family: inherit;
  border: 1px solid #d1c4e9;
  border-radius: 8px;
  background: white;
  color: #2d2d2d;
}
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem;
  padding: 10px 14px 10px 0; cursor: pointer; }
.chk input { width: 20px; height: 20px; }
.chk.row { display: flex; margin-top: 4px; }
.hint-line { font-size: 0.78rem; color: #7b1fa2; margin-top: 6px; }
.save-btn {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: #7b1fa2;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.save-btn:disabled { background: #b39ddb; }
.save-status { margin-top: 10px; font-size: 0.86rem; line-height: 1.4; }
.save-status.bad  { color: #c62828; font-weight: 600; }
.save-status.good { color: #2e7d32; }
.saved-note { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px;
  background: #e8f5e9; color: #1b5e20; font-size: 0.86rem; line-height: 1.4; }
.more-btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: white;
  border: 1px dashed #d1c4e9;
  border-radius: 10px;
  color: #7b1fa2;
  font-size: 0.88rem;
  cursor: pointer;
}

/* ── Responsive ───────────────────────────────────── */
@media (max-width: 620px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .chart-wrap { height: 210px; }
  .chart-missing { height: 210px; }
  .hide-sm { display: none; }

  /* Even after hide-sm has done its work the log still shows eight columns on a
     phone, so .tbl-wrap scrolls it sideways — and Temp, Flow and Quality scroll
     away from the day they belong to. Pin Day and Date so a row always says what
     it is.

     Column 2 stops at column 1's width, so the two numbers must be identical: if
     the offset is the larger one a strip of scrolling content shows between them.
     One custom property feeds both so they cannot drift. min/max-width rather than
     width because the auto table layout treats a plain width as a suggestion and
     shrank this column to less than the offset.

     Day is one or two digits, but the DAY header is the wider of the two and sets
     the floor, so this column also gets tighter side padding than the rest of the
     table. --pin is the one knob; raise it if the header ever clips. */
  .log-tbl { --pin: 38px; }
  .log-tbl th:first-child,  .log-tbl td:first-child,
  .log-tbl th:nth-child(2), .log-tbl td:nth-child(2) { position: sticky; z-index: 1; }
  .log-tbl th:first-child,  .log-tbl td:first-child {
    left: 0;
    min-width: var(--pin);
    max-width: var(--pin);
    padding-left: 6px;
    padding-right: 6px;
  }
  .log-tbl th:nth-child(2), .log-tbl td:nth-child(2) {
    left: var(--pin);
    border-right: 1px solid #ece8f2;
  }
  /* The row carries the colour (blood, ovulation, empty); the cell borrows it,
     or the scrolling columns would show through from underneath. */
  .log-tbl td:first-child, .log-tbl td:nth-child(2)  { background: inherit; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Fertility Awareness</h1>
    <div class="sub">Basal Body Temperature Tracker</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">&#8635; Refresh</button>
</header>

<main>
  <div id="app"><div class="spinner">Loading data from Google Sheets&hellip;</div></div>
</main>

<script>
let timelineChart   = null;
let overlayChart    = null;
let allCycles        = null;
let overlayShowFull  = false;
let selectedLogCycle = null;
let currentDayNumber = null;
let _tab             = 'dashboard';
let _role            = null;   // 'writer' | 'reader', as the server reported it

// ── Helpers ────────────────────────────────────────────────────────────────

function splitCycles(rows) {
  const cycles = [];
  let cur = [];
  for (const r of rows) {
    const d = parseInt(r.Day);
    if (isNaN(d)) continue;
    if (d === 1 && cur.length > 0) { cycles.push(cur); cur = []; }
    cur.push(r);
  }
  if (cur.length > 0) cycles.push(cur);
  return cycles;
}

// ── Cycle facts and the safety engine ──────────────────────────

// >>> SAFETY — extracted and executed verbatim by Tools/safety-selfcheck.js and
// Tools/verify-proxy.js, which match on these two marker lines. Keep them, and
// keep this block free of anything that only exists in a browser.

// Every column a logged day can carry. A row that has none of them is empty.
// ca2's columns are listed too — without them a spotting-only or
// cervix-position-only day (which ca5 can write) would read as an empty row.
// Keep this list complete: a column missing from it makes real days look blank.
// Tools/adapter-selfcheck.js asserts it covers every column the sheet carries.
function hasData(r) {
  return r.Temp || r.Time || r['Temp Quality'] || r.Exclude || r.Flow || r['Cervix Texture'] ||
         r['Cervical Mucus'] || r['Cervix Position'] || r.Breasts ||
         r['Cycle Start'] || r.Ovulation || r.Note;
}

// The two facts every rule below is built from, read straight off the sheet's
// own columns. ca3's synthesised r.Cycle is gone, and with it any chance of a
// display string and a safety rule disagreeing about what a day was.
// Spotting is deliberately NOT bleeding: the opening-bleed-run rule would
// otherwise swallow the spotting days that trail cycles 3 and 4.
const isOv       = r => r.Ovulation === 'TRUE';
const isBleeding = r => String(r.Flow || '').trim().toLowerCase() === 'bleeding';

// The tag the charts and the log table print for a day. Display only — no rule
// consults it. Ovulation wins a collision, exactly as ca3's adapter did.
function phaseTag(r) { return isOv(r) ? 'Ovulation' : isBleeding(r) ? 'Blood' : ''; }

// A reading the rules may use: it exists and was not flagged Exclude (any
// non-empty value excludes — ca2 writes TRUE, the old sheet wrote Y). Six
// migrated rows carry no temperature at all; a temp-less day is skipped, never
// read as a zero and never counted as one of the six or the three.
const isUsableTemp = r => !!r.Temp && !(r.Exclude || '').trim();

// Temperatures compare in integer hundredths, never in floating point:
// 97.88 + 0.1 is 97.97999999999999, so 97.98 tests as ABOVE a coverline it
// actually ties — which opened cycle 4's window on day 36 instead of 37, a day
// early on the unsafe side. A tie must never clear the coverline.
const cents = t => Math.round(parseFloat(t) * 100);

// Bleeding / Follicular / Luteal only. Ovulation is never a phase — it is only
// ever known days after the fact.
function detectPhase(cycle) {
  // Look at the last five *logged* rows. The sheet can carry blank rows at the
  // end; slicing the raw array would read only blanks.
  const last5 = cycle.filter(hasData).slice(-5);
  if (last5.some(isBleeding)) return 'bleeding';
  // Luteal only if an Ovulation marker has been logged earlier this cycle.
  if (cycle.some(isOv)) return 'luteal';
  return 'follicular';
}

// Ovulation row for a cycle: the hard manual marker, or nothing. Ovulation is
// never inferred — not from mucus, not from temperature, not from anything.
function detectOvRow(cycle) {
  return cycle.find(isOv) || null;
}

function detectOvDay(cycle) {
  const ov = detectOvRow(cycle);
  return ov ? parseInt(ov.Day) : null;
}

// Coverline in hundredths: the max of the six usable temps before the ovulation
// marker, plus 0.1°F. Null until the marker exists — before it there is no
// coverline anywhere in the app. The pre-ovulation window is taken wider than
// six rows on purpose, so excluded readings are backfilled by earlier days.
function coverlineCents(cycle) {
  const ovIdx = cycle.findIndex(isOv);
  if (ovIdx < 0) return null;
  const pre = cycle.slice(0, ovIdx).filter(isUsableTemp).slice(-6).map(r => cents(r.Temp));
  return pre.length ? Math.max(...pre) + 10 : null;
}

// Degrees, for the charts and the cards. Every comparison uses the cents.
function calcCoverline(cycle) {
  const c = coverlineCents(cycle);
  return c == null ? null : c / 100;
}

// Index of the last row that actually has logged data.
function lastDataIndex(cycle) {
  for (let i = cycle.length - 1; i >= 0; i--) {
    if (hasData(cycle[i])) return i;
  }
  return cycle.length - 1;
}

// How far the data is behind the calendar. Cycle day keeps advancing every
// midnight whether or not anything was logged, so this gap is the reader’s only
// clue that the verdict above it is running on old observations.
function unloggedDays(cycle, dayNumber) {
  const last = parseInt(cycle[lastDataIndex(cycle)].Day);
  return isNaN(last) ? 0 : Math.max(0, dayNumber - last);
}

// The opening bleed run: Day 1 through the last CONSECUTIVE bleeding day. Keyed
// to the opening run specifically, so mid-cycle breakthrough bleeding can never
// flip a fertile day to Safe. A missing day ends the run — an unlogged day is
// not evidence of bleeding.
function openingBleedEnd(cycle) {
  let end = 0;
  for (const r of cycle) {
    if (parseInt(r.Day) !== end + 1 || !isBleeding(r)) break;
    end += 1;
  }
  return end;
}

// Three-over-six: three consecutive usable temps above a coverline drawn from
// the six usable temps immediately BEFORE the first of them, where the third
// clears that line by at least 0.2°F. The baseline six and the three highs must
// not overlap — that overlap was a real bug in the prototype and made the rule
// never fire at all. Returns the cycle day of the third high, or null.
function threeOverSixDay(cycle) {
  const u = cycle.filter(isUsableTemp);
  for (let i = 6; i + 2 < u.length; i++) {
    const cl = Math.max(...u.slice(i - 6, i).map(r => cents(r.Temp))) + 10;
    const h  = u.slice(i, i + 3).map(r => cents(r.Temp));
    if (h[0] > cl && h[1] > cl && h[2] >= cl + 20) return parseInt(u[i + 2].Day);
  }
  return null;
}

// The day the post-ovulation window opens: the LATER of the manual marker + 4
// and the three-over-six fire day. No marker means it never opens — three-over-
// six may only delay the opening, never trigger it on its own. Without that the
// app declared a false "Safe" on cycle 5 day 12 (2026-08-26).
function safeWindowOpensOn(cycle) {
  const ovDay = detectOvDay(cycle);
  if (ovDay == null) return null;
  const fire = threeOverSixDay(cycle);
  return fire == null ? ovDay + 4 : Math.max(ovDay + 4, fire);
}

// Two states only: Safe / Unsafe. Unsafe absorbs every kind of unknown.
// There is no pre-ovulation safe window other than the opening bleed run: ca1’s
// `day < ovDay - 6` branch could never fire on a live cycle, because the marker
// only exists once ovulation has already passed. It is deliberately not carried
// over — the app must not look like it has a window it does not have.
function safetyVerdict(cycle, dayNumber) {
  const bleedEnd = openingBleedEnd(cycle);
  if (bleedEnd > 0 && dayNumber <= bleedEnd) {
    return { safe: true, hint: `Opening bleed run — Day 1 to Day ${bleedEnd}` };
  }
  const ovDay = detectOvDay(cycle);
  const opens = safeWindowOpensOn(cycle);
  if (opens != null && dayNumber >= opens) {
    return { safe: true, hint: `${dayNumber - ovDay} days past ovulation (Day ${ovDay})` };
  }
  if (ovDay == null) {
    return { safe: false, hint: 'Ovulation not yet confirmed this cycle' };
  }
  const n = opens - dayNumber;
  return { safe: false, hint: `Safe in ${n} day${n !== 1 ? 's' : ''} — post-ovulation wait` };
}
// <<< SAFETY

// ── Moon phase ─────────────────────────────────────────────────────────────
// Pure date math against a known new moon — no API, no network, works offline.
// Mean-synodic approximation: accurate to a few hours, far tighter than the
// ~3.7-day width of a phase bucket.

const SYNODIC_MONTH  = 29.530588853;                  // days between new moons
const NEW_MOON_EPOCH = Date.UTC(2000, 0, 6, 18, 14);  // a known new moon

const MOON_PHASES = [
  { name: 'New Moon',        glyph: '\u{1F311}' },
  { name: 'Waxing Crescent', glyph: '\u{1F312}' },
  { name: 'First Quarter',   glyph: '\u{1F313}' },
  { name: 'Waxing Gibbous',  glyph: '\u{1F314}' },
  { name: 'Full Moon',       glyph: '\u{1F315}' },
  { name: 'Waning Gibbous',  glyph: '\u{1F316}' },
  { name: 'Last Quarter',    glyph: '\u{1F317}' },
  { name: 'Waning Crescent', glyph: '\u{1F318}' },
];

// Phase for a calendar day, sampled at local noon so the answer is the phase
// that day is generally recognised as having.
function moonPhase(date) {
  if (!(date instanceof Date) || isNaN(date.getTime())) return null;
  const noon = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const days = (noon - NEW_MOON_EPOCH) / 86400000;
  const age  = ((days % SYNODIC_MONTH) + SYNODIC_MONTH) % SYNODIC_MONTH;
  // +0.5 centres each bucket on its named phase rather than starting there.
  const index = Math.floor((age / SYNODIC_MONTH) * 8 + 0.5) % 8;
  return {
    ...MOON_PHASES[index],
    index,
    age,
    illumination: (1 - Math.cos(2 * Math.PI * age / SYNODIC_MONTH)) / 2,
  };
}

function moonCell(row) {
  const m = row && moonPhase(row._date);
  if (!m) return '\u2014';
  const lit = Math.round(m.illumination * 100);
  return `<span class="moon" title="${m.name} \u00b7 ${lit}% lit">${m.glyph}</span>` +

}

      if (cur && opts.indexOf(cur) < 0) { opts.push(cur); labs.push(cur + ' (already in the sheet)'); }
      return wrap(`<select id="${id}" ${f.col === 'Flow' ? 'onchange="onFlowChange()"' : ''}>${
        opts.map((o, j) => `<option value="${escHTML(o)}"${o === cur ? ' selected' : ''}>${escHTML(labs[j])}</option>`).join('')
      }</select>`);
    }
    return wrap(`<textarea id="${id}" rows="2">${escHTML(val(f.col))}</textarea>`);
  }).join('');

  return `<div class="day-body">
    ${body}
    <div class="hint-line" id="entryHint"></div>
    <button class="save-btn" id="saveBtn" onclick="saveEntry('${iso}')">${row ? 'Save changes' : 'Save new entry'}</button>
    <div class="save-status" id="saveStatus"></div>
  </div>`;
}

function openDay(iso) {
  _savedNote = null;   // acknowledged by moving on
  _skippedRefreshes = 0;
  _openDate = _openDate === iso ? null : iso;
  redraw();
}

function showMoreDays() {
  _catchupDays += 14;
  redraw();
}

function setHint(msg) {
  const el = document.getElementById('entryHint');
  if (el) el.textContent = msg;
}

function setSaveStatus(msg, cls) {
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = msg; el.className = 'save-status ' + (cls || ''); }
}

// Suggestions, both of them: they tick a box Mike can untick, and neither ever
// reaches the sheet on its own.
function onFlowChange() {
  const cs = document.getElementById('f' + F_AT('Cycle Start'));
  if (!cs || cs.checked || !_openDate) return;
  const flowOn = iso => iso === _openDate
    ? document.getElementById('f' + F_AT('Flow')).value
    : (_byIso.get(iso) || {}).Flow || '';
  if (suggestCycleStart(flowOn, _openDate)) {
    cs.checked = true;
    setHint('Bleeding after a clear stretch — Cycle start ticked as a suggestion. Untick it if this is not Day 1.');
  }
}

function onQualityChange() {
  const ex = document.getElementById('f' + F_AT('Exclude'));
  const qi = F_AT('Temp Quality');
  const any = QUALITY_OPTS.some((_, j) => {
    const b = document.getElementById(`f${qi}_${j}`);
    return b && b.checked;
  });
  if (any && ex && !ex.checked) {
    ex.checked = true;
    setHint('Flagged reading — Exclude ticked as a suggestion. Untick it to keep using this temperature.');
  }
}

function readForm() {
  const form = {};
  ENTRY_FIELDS.forEach((f, i) => {
    if (f.type === 'quality') {
      form[f.col] = QUALITY_OPTS.filter((_, j) => document.getElementById(`f${i}_${j}`).checked);
    } else if (f.type === 'flag') {
      form[f.col] = document.getElementById('f' + i).checked;
    } else {
      form[f.col] = document.getElementById('f' + i).value;
    }
  });
  return form;
}

// JSONP is GET-only, so the write path is a real fetch. text/plain keeps it a
// "simple" request: Apps Script cannot answer a CORS preflight, and an
// application/json content type would provoke one and fail before it left.
function postEntry(iso, values) {
  return fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ t: TOKEN, date: iso, values: values }),
    signal: AbortSignal.timeout(30000),
  }).then(res => res.text().then(text => {
    try { return JSON.parse(text); }
    catch (e) { throw new Error(`the server replied with something that is not an answer (HTTP ${res.status})`); }
  }));
}

async function saveEntry(iso) {
  if (_saving) return;
  // A manual flush is allowed to run with a card open, so this button is live
  // while one is in flight. Saving into that window loses work: queueEntry would
  // merge the new fields into the entry the flush is mid-way through sending, and
  // the flush's own `_queue.filter()` would then drop the merged entry whole.
  if (_flushing) return setSaveStatus('Still sending earlier entries — try again in a moment.', 'bad');
  const row  = _byIso.get(iso) || null;
  const form = readForm();

  const problem = entryProblem(row, form);
  if (problem) return setSaveStatus(problem, 'bad');

  const diff = entryDiff(row, form);
  if (!Object.keys(diff).length) return setSaveStatus('Nothing has changed on this day.', 'bad');
  if (!confirm(confirmText(dayLabel(iso), diff))) return;

  _saving = true;
  const btn = document.getElementById('saveBtn');
  if (btn) btn.disabled = true;
  setSaveStatus('Saving…', '');
  try {
    const res = await postEntry(iso, diff);
    if (!res || res.ok !== true) {
      const err = new Error(writeErrorText(res && res.error));
      err.refusal = isRefusal(res && res.error);
      throw err;
    }
    // Re-read rather than patch the copy in memory: the safety verdict is
    // derived from the sheet, and a backdated write moves it.
    _openDate = null;
    // The write can succeed and still have something to say. ca5a added two such
    // fields server-side and neither was read here — a warning nobody reads is a
    // warning that does not exist.
    const warn = writeWarnings(res);
    if (warn.length) console.warn('Write warning:', warn);
    _savedNote = { iso: iso, action: res.action || 'saved', warn: warn };
    setSaveStatus('Saved. Reloading…', 'good');
    loadData();
  } catch (e) {
    console.error('Write failed:', e);
    // Never optimistic. Nothing here claims the sheet has it — and pressing Save
    // again rewrites the same row rather than adding a second.
    const text = e.name === 'TimeoutError'
      ? 'the server did not reply within 30 seconds.' : e.message;
    if (e.refusal) {
      // A refusal will refuse again for as long as the link is what it is.
      // Queueing it would pin a banner no retry could ever clear.
      setSaveStatus('NOT saved — ' + text, 'bad');
    } else if (queueEntry(iso, diff, text)) {
      // Kept, not lost. The card closes because the values are safe in the
      // queue and shown on its summary line; the banner says the rest.
      _openDate = null;
      redraw();            // the `finally` below still clears _saving
      return;
    } else {
      setSaveStatus('NOT saved, and this phone would not keep it to send later — ' + text +
        ' Do not close the app: press Save again, or write the numbers down.', 'bad');
    }
  } finally {
    _saving = false;
    if (btn) btn.disabled = false;
  }
}

let _queue     = [];     // unsent entries, one per date, oldest date first
let _queueNote = null;   // what the last flush had to say; kept across reloads
let _flushing  = false;

function loadQueue() {
  let raw = null;
  try { raw = localStorage.getItem(QUEUE_KEY); }
  catch (e) { console.error('The unsent queue could not be read from this phone:', e); }
  const q = queueParse(raw);
  _queue = q.entries;
  _queueNote = q.note;
  const lost = lostQueueText(q.lost);
  if (lost) {
    console.error('Unsent entries could not be read back:', raw);
    _queueNote = { at: Date.now(), text: (_queueNote ? _queueNote.text : []).concat(lost) };
    saveQueue();   // replace the rubbish, so the message is not repeated forever
  }
}

// Returns false if the entry could not be kept. Every caller must say so on
// screen: this is the one storage failure in the app that loses real work.
function saveQueue() {
  const write = () => localStorage.setItem(QUEUE_KEY,
    JSON.stringify({ entries: _queue, note: _queueNote }));
  try { write(); return true; }
  catch (e) {
    console.error('Could not save the unsent queue:', e);
    // ca7 makes room by dropping the display cache. Unsent work outranks a
    // saved copy of data the sheet already has.
    try { localStorage.removeItem(CACHE_KEY); write(); return true; }
    catch (e2) { console.error('Still could not save the unsent queue:', e2); return false; }
  }
}

function queueEntry(iso, values, lastError) {
  _queue = queueMerge(_queue, iso, values, Date.now());
  const e = _queue.find(q => q.iso === iso);
  e.tries = (e.tries || 0) + 1;
  e.lastError = lastError || null;
  return saveQueue();
}

function queuedFor(iso) { return _queue.find(e => e.iso === iso) || null; }

function queueBannerHTML() {
  // Not `!== 'writer'`: `_role` only arrives from the display cache or a live
  // read, and saveQueue() deletes that cache to make room. A writer who is
  // offline with no cache has role `null` — and hiding their unsent entries is
  // exactly the silent loss this banner exists to prevent. Only a confirmed
  // reader is excluded, and a reader can never have a queue anyway (a refusal is
  // never queued).
  if (_role === 'reader') return '';   // Tirzah never sees this one
  const lines = queueBannerLines(_queue, _queueNote, Date.now(), dayLabel);
  if (!lines.length) return '';
  // No close button, by design: this is not a notice, it is the state of work
  // that has not landed. It goes when the queue does.
  const buttons = _queue.length
    ? `<button class="qbtn" onclick="flushQueue(true)"${_flushing ? ' disabled' : ''}>` +
      `${_flushing ? 'Sending…' : 'Try sending now'}</button>` +
      `<button class="qbtn discard" onclick="discardQueue()"${_flushing ? ' disabled' : ''}>Discard</button>`
    : `<button class="qbtn discard" onclick="clearQueueNote()">Dismiss</button>`;
  return `<div class="banner queue" id="queueBanner">${
    lines.map(l => `<div>${escHTML(l)}</div>`).join('')}${buttons}</div>`;
}

// Swap the banner alone. A full re-render would wipe a half-typed entry, and a
// flush is at its most useful exactly when a card is open.
function refreshQueueBanner() {
  // The day cards carry their own "not sent yet" line, and a flush that landed
  // while a card was open would leave those lines claiming work the sheet now
  // has — with the banner that contradicted them gone. The cards are not
  // re-rendered here (that would wipe the open form), so drop the stale spans.
  // `data-iso` is what makes them findable; render-selfcheck asserts it is there.
  for (const s of document.querySelectorAll('.unsent[data-iso]')) {
    if (!queuedFor(s.getAttribute('data-iso'))) s.remove();
  }
  const el   = document.getElementById('queueBanner');
  const html = queueBannerHTML();
  if (el && html) el.outerHTML = html;
  else if (el) el.remove();
  else if (html) {
    const app = document.getElementById('app');
    if (app) app.insertAdjacentHTML('afterbegin', html);
  }
}

function redrawAfterQueueChange() {
  if (_openDate) refreshQueueBanner();
  else redraw();
}

// The note outlives the entries it describes, so it needs its own way out —
// otherwise a warning about a flush that has finished would sit there forever.
function clearQueueNote() {
  _queueNote = null;
  saveQueue();
  redrawAfterQueueChange();
}

// The only way an entry leaves the queue other than a confirmed write, and it
// takes a confirmation listing exactly what is being thrown away.
function discardQueue() {
  if (!_queue.length || _flushing) return;
  const n = _queue.length;
  const what = _queue.map(e => dayLabel(e.iso) + ' — ' + describeValues(e.values).join(', ')).join('\n');
  if (!confirm(`Throw away ${n} unsent entr${n === 1 ? 'y' : 'ies'}?\n\n${what}\n\n` +
               `The sheet does not have ${n === 1 ? 'it' : 'them'}, and this cannot be undone.`)) return;
  console.warn('Unsent entries discarded by hand:', _queue);
  _queue = [];
  _queueNote = { at: Date.now(), text: ['Unsent entries were discarded. The sheet never received them.'] };
  saveQueue();
  redrawAfterQueueChange();
}

// One at a time and in date order. The endpoint serialises writes under a script
// lock anyway, and a partial failure has to leave exactly the entries that
// failed — which a parallel send cannot promise. Re-sending is safe: `doPost`
// updates the row for that date rather than adding a second one.
async function flushQueue(manual) {
  if (_flushing || _saving || !_queue.length || _role === 'reader') return;   // see queueBannerHTML
  // A flush that re-renders would wipe a half-typed entry, so the automatic one
  // waits (the same rule the 10-minute refresh follows). Mike's own button may
  // go ahead: nothing below re-renders while a card is open.
  if (_openDate && !manual) return;

  _flushing = true;
  refreshQueueBanner();
  const notes = [];
  let sent = 0;
  try {
    for (const e of _queue.slice()) {
      try {
        const res = await postEntry(e.iso, e.values);
        if (!res || res.ok !== true) {
          const err = new Error(writeErrorText(res && res.error));
          err.refusal = isRefusal(res && res.error);
          throw err;
        }
        // Confirmed, so it goes — and the sheet, not this copy, is what gets
        // read back afterwards.
        _queue = _queue.filter(q => q.iso !== e.iso);
        sent++;
        // ca5a: ok:true is not the same as "stored what was sent". The row has
        // been written and re-sending would land the same value again, so the
        // entry still leaves the queue — but the warning must not leave with it.
        for (const w of writeWarnings(res)) notes.push(`${dayLabel(e.iso)} saved, but ${w}`);
      } catch (err) {
        const text = err.name === 'TimeoutError'
          ? 'the server did not reply within 30 seconds.' : err.message;
        e.tries = (e.tries || 0) + 1;
        e.lastError = text;
        notes.push(err.refusal
          ? `${dayLabel(e.iso)} could not be sent: ${text} It is still here, and nothing more ` +
            'will send until that is sorted out.'
          : `${dayLabel(e.iso)} could not be sent: ${text}`);
        console.error('Flush failed on', e.iso, err);
        break;   // whatever stopped this one will stop the rest; they keep their turn
      }
    }
  } finally {
    // Nothing below re-reads the sheet while a card is open, so the list and the
    // summaries behind the form are older than the write that just landed. Say
    // so rather than let a stale row read as the current one.
    if (sent && _openDate) notes.push(`${sent} sent. The days behind this form have not been ` +
      're-read from the sheet yet — close it, or wait for the next refresh.');
    _queueNote = notes.length ? { at: Date.now(), text: notes } : null;
    if (!saveQueue()) {
      _queueNote = { at: Date.now(), text: notes.concat(
        'This phone would not store the unsent list, so it will not survive a reload. ' +
        'Send it now, or write the numbers down.') };
    }
    _flushing = false;
  }
  // Re-read rather than trust what was sent.
  if (sent && !_openDate) loadData();
  else redrawAfterQueueChange();
}

// ── Render ─────────────────────────────────────────────────────────────────

function render(cycles) {
  // Set before the branch: both screens read it, and openDay/showMoreDays
  // re-render from it.
  allCycles = cycles;

  // The Log tab is its own screen. Charts are torn down rather than left
  // pointing at a canvas that is no longer in the page.
  if (_tab === 'log' && _role === 'writer') {
    if (timelineChart) { timelineChart.destroy(); timelineChart = null; }
    if (overlayChart)  { overlayChart.destroy();  overlayChart  = null; }
    document.getElementById('app').innerHTML =
      queueBannerHTML() +
      bannerHTML(_staleInfo, _dataWarnings, _bannerDismissed, Date.now()) + tabBarHTML() + entryScreenHTML(cycles);
    return;
  }

  const current  = cycles[cycles.length - 1];
  const past     = cycles.slice(0, -1);
  const currentCoverline = calcCoverline(current); // null until ovulation is marked

  const phase      = detectPhase(current);
  const phaseLabel = { bleeding:'Bleeding', follicular:'Follicular', luteal:'Luteal' }[phase];

  const lengths  = past.map(c => c.length);
  const avg      = lengths.length ? Math.round(lengths.reduce((a,b) => a+b, 0) / lengths.length) : null;

  // Cycle day is date arithmetic from the Day-1 row, never the day number of
  // the last logged row — otherwise it falls behind by one per unlogged day.
  const dayNumber = (() => {
    const start = current[0]?._date;
    if (start instanceof Date && !isNaN(start)) {
      // Normalise both ends to local midnight so the difference is an exact
      // whole number of days and immune to DST.
      const a = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const n = new Date();
      const b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      return Math.round((b - a) / 86400000) + 1;
    }
    console.warn('Cycle start date missing — falling back to last logged Day number');
    return parseInt(current[lastDataIndex(current)].Day);
  })();
  currentDayNumber = dayNumber;

  // Once ovulation is confirmed, the luteal phase is a reliable ~14 days,
  // so predict from the ovulation day instead of the historical average.
  const ovRow        = detectOvRow(current);
  const ovDayNum     = detectOvDay(current);
  const predictedLen = ovDayNum != null ? ovDayNum + 14 : avg;
  const fromOvulation = ovDayNum != null;
  const daysLeft     = predictedLen ? Math.max(0, predictedLen - dayNumber) : null;

  // Confirmed ovulation → ovulation date + 14. Otherwise cycle start + avg length.
  const anchorRow = fromOvulation ? ovRow : current[0];
  const anchorAdd = fromOvulation ? 14 : avg;
  const nextPeriodDate = (() => {
    if (!predictedLen || !anchorRow?._date) return null;
    const d = new Date(anchorRow._date);
    d.setDate(d.getDate() + anchorAdd);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  })();

  const lastTempRow = [...current].reverse().find(r => r.Temp);
  const lastTemp    = lastTempRow ? parseFloat(lastTempRow.Temp).toFixed(2) : '—';
  // An excluded reading still shows as the last temperature — it was taken — but
  // it gets no above/below verdict, because Exclude means exactly “do not judge
  // by this one”. Comparison is in hundredths so a tie reads as below. (ca3a)
  const clCents     = coverlineCents(current);
  const aboveLine   = (lastTempRow && isUsableTemp(lastTempRow) && clCents != null)
    ? cents(lastTempRow.Temp) > clCents : null;
  const unlogged    = unloggedDays(current, dayNumber);

  // ── Safe-sex status ──────────────────────────────────────────────────────
  // The whole rule lives in safetyVerdict() inside the SAFETY block, so the
  // self-checks test the same code the phone runs. Only the hard Ovulation
  // marker is ever consulted — never mucus, never a guess.
  const verdict = safetyVerdict(current, dayNumber);
  let safeStatus, safeClass, safeHint;
  if (verdict.safe) {
    safeStatus = 'Safe';
    safeClass  = 'safe';
    safeHint   = verdict.hint;
  } else {
    safeStatus = 'Unsafe';
    safeClass  = 'unsafe';
    safeHint   = verdict.hint;
  }

  // Past the cutoff, show no verdict rather than a confident stale one. This
  // sits after the Safe/Unsafe branch so it overrides both, and it is
  // independent of the banner — dismissing that changes nothing here.
  if (_staleInfo && cacheExpired(_staleInfo.at, Date.now())) {
    safeStatus = 'Out of date';
    safeClass  = 'unknown';
    safeHint   = `Saved data from ${cacheDate(_staleInfo.at)} — too old to judge.`;
  }

  // Everything else on this screen is worth showing a second early. This one
  // is not: a verdict computed from the saved copy could be a "Safe" the sheet
  // would disagree with, and that is the one wrong answer this app must never
  // give. It fills in by itself when the read lands, a second or two later.
  if (_provisional) {
    safeStatus = 'Checking…';
    safeClass  = 'unknown';
    safeHint   = 'Reading the sheet. The status appears once it answers.';
  }

  // ── Stats cards ──────────────────────────────────────────────────────────
  const statsHTML = `
    <div class="stats">
      <div class="card card-${safeClass}">
        <div class="lbl">Safe Sex Status</div>
        <div class="val status-${safeClass}" style="font-size:1.45rem;padding-top:4px">${safeStatus}</div>
        <div class="hint">${safeHint}</div>
      </div>
      <div class="card">
        <div class="lbl">Cycle Day</div>
        <div class="val">${dayNumber}</div>
        <div class="hint">Started ${current[0]?.Date || '—'}${unlogged
          ? ` &middot; <span class="status-caution">${unlogged} day${unlogged !== 1 ? 's' : ''} unlogged</span>`
          : ''}</div>
      </div>
      <div class="card">
        <div class="lbl">Current Phase</div>
        <div class="val" style="font-size:1.5rem;padding-top:6px">${phaseLabel}</div>
      </div>
      <div class="card">
        <div class="lbl">Last Temp</div>
        <div class="val">${lastTemp}<span style="font-size:1rem;font-weight:400">&deg;</span></div>
        <div class="hint">${aboveLine === null ? '' : (aboveLine ? 'Above' : 'Below') + ` coverline (${currentCoverline.toFixed(2)}&deg;)`}</div>
      </div>
      <div class="card">
        <div class="lbl">Avg Cycle Length</div>
        <div class="val">${avg ?? '—'}<span style="font-size:1rem;font-weight:400"> days</span></div>
        <div class="hint">${lengths.length} complete cycle${lengths.length !== 1 ? 's' : ''}</div>
      </div>
      ${predictedLen != null ? `<div class="card">
        <div class="lbl">Next Period Est.</div>
        <div class="val" style="font-size:1.1rem;padding-top:4px">${nextPeriodDate ?? '—'}</div>
        <div class="hint">~${daysLeft} days away &middot; ${fromOvulation ? `14 days post-ovulation (Day ${ovDayNum})` : `${avg}-day avg`}</div>
      </div>` : ''}
    </div>`;

  // ── Chart section — timeline + overlay ───────────────────────────────────
  const cycleColors = ['#1e88e5','#e53935','#fb8c00','#43a047','#8e24aa'];
  const chartHTML = `
    <div class="section">
      <h2>BBT &mdash; Full Timeline</h2>
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#1e88e5"></div>Temperature</div>
        <div class="legend-item"><div class="dash-line" style="background:#9e9e9e"></div>Coverline (per cycle, max pre-ov + 0.1&deg;)</div>
        <div class="legend-item"><div class="dot" style="background:#e53935"></div>Menstrual</div>
        <div class="legend-item"><div class="dot" style="background:#ab47bc"></div>Ovulation</div>
        <div class="legend-item"><span class="moon" style="margin-right:0">\u{1F313}</span>Moon phase (strip above chart)</div>
      </div>
      <div class="chart-wrap"><canvas id="chartTimeline"></canvas></div>
    </div>
    <div class="section">
      <h2>Cycle Comparison &mdash; by Day Number</h2>
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#e53935"></div>Menstrual</div>
        <div class="legend-item"><div style="width:12px;height:14px;background:rgba(30,136,229,0.18);border:1px solid #1e88e5;border-radius:2px"></div>Ovulation day (color matches cycle)</div>
      </div>
      <div class="overlay-controls">
        <label class="trim-label">
          <input type="checkbox" id="fullRangeToggle" ${overlayShowFull ? 'checked' : ''}
            onchange="overlayShowFull=this.checked;drawOverlayChart(allCycles)">
          Show all cycles
        </label>
      </div>
      <div class="chart-wrap"><canvas id="chartOverlay"></canvas></div>
    </div>`;

  // ── Cycle history table ───────────────────────────────────────────────────
  // Current cycle row is omitted entirely until at least one day has data.
  const currentHasData = current.some(hasData);
  // Ovulation for the in-progress cycle uses the confirmed marker only —
  // never the mucus estimate — to stay consistent with the Safe Sex card.
  const currentRowHTML = currentHasData ? `<tr class="row-current">
    <td>Cycle ${cycles.length}<span class="tag tag-current">Current</span></td>
    <td>${current[0]?.Date || '—'}</td>
    <td>${dayNumber} day${dayNumber !== 1 ? 's' : ''}</td>
    <td>${ovDayNum != null ? `Day ${ovDayNum}` : '—'}</td>
    <td class="hide-sm">${moonCell(current[0])}</td>
    <td class="hide-sm">${ovRow ? moonCell(ovRow) : '—'}</td>
  </tr>` : '';

  // Averages cover completed cycles only; ovulation skips cycles with no day recorded.
  const pastOvDays = past.map(detectOvDay).filter(d => d != null);
  const avgOvDay   = pastOvDays.length
    ? Math.round(pastOvDays.reduce((a, b) => a + b, 0) / pastOvDays.length)
    : null;

  const historyHTML = (past.length || currentHasData) ? `
    <div class="section">
      <h2>Cycle History</h2>
      <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Cycle</th><th>Start Date</th><th>Length</th><th>Ovulation</th>
          <th class="hide-sm">Moon at Day 1</th><th class="hide-sm">Moon at Ovulation</th>
        </tr></thead>
        <tbody>
          ${past.map((c, i) => `<tr>
            <td>Cycle ${i + 1}</td>
            <td>${c[0]?.Date || '—'}</td>
            <td>${c.length} days</td>
            <td>${detectOvDay(c) != null ? `Day ${detectOvDay(c)}` : '—'}</td>
            <td class="hide-sm">${moonCell(c[0])}</td>
            <td class="hide-sm">${moonCell(detectOvRow(c))}</td>
          </tr>`).join('')}
          ${currentRowHTML}
        </tbody>
        ${past.length ? `<tfoot><tr>
          <td>Average</td>
          <td></td>
          <td>${avg != null ? `${avg} days` : '—'}</td>
          <td>${avgOvDay != null ? `Day ${avgOvDay}` : '—'}</td>
          <td class="hide-sm"></td><td class="hide-sm"></td>
        </tr></tfoot>` : ''}
      </table>
      </div>
    </div>` : '';

  // ── Daily log table ───────────────────────────────────────────────────────
  // Default to current cycle; preserve selection across auto-refreshes
  if (selectedLogCycle === null || selectedLogCycle >= cycles.length) {
    selectedLogCycle = cycles.length - 1;
  }

  const cycleOptions = cycles.map((c, i) => `
    <option value="${i}" ${i === selectedLogCycle ? 'selected' : ''}>
      Cycle ${i + 1} &mdash; ${c[0]?.Date || '?'}${i === cycles.length - 1 ? ' (Current)' : ''}
    </option>`).join('');

  const logHTML = `
    <div class="section">
      <div class="section-header">
        <h2>Daily Log</h2>
        <select class="cycle-select" onchange="onLogCycleChange(this.value)">${cycleOptions}</select>
      </div>
      <div class="tbl-wrap">
      <table class="log-tbl">
        <thead><tr>
          <th>Day</th><th>Date</th><th>Temp</th>
          <th class="hide-sm">Time</th>
          <th>Flow</th>
          <th class="hide-sm">Cervix</th>
          <th class="hide-sm">Pos</th>
          <th class="hide-sm">Mucus</th>
          <th class="hide-sm">Breasts</th>
          <th>Quality</th>
          <th>Exc</th>
          <th>Phase</th><th>Note</th>
        </tr></thead>
        <tbody id="logTableBody">${buildLogRows(cycles[selectedLogCycle])}</tbody>
      </table>
      </div>
    </div>`;

  // Drawn from the cache, "Last updated <now>" would be a lie.
  const footerHTML = _staleInfo
    ? `<div class="footer">Saved ${new Date(_staleInfo.at).toLocaleString()} &nbsp;&middot;&nbsp; Retrying every 10 minutes</div>`
    : `<div class="footer">Last updated ${new Date().toLocaleTimeString()} &nbsp;&middot;&nbsp; Auto-refreshes every 10 minutes</div>`;

  document.getElementById('app').innerHTML =
    queueBannerHTML() +
    bannerHTML(_staleInfo, _dataWarnings, _bannerDismissed, Date.now()) + tabBarHTML() + statsHTML + chartHTML + historyHTML + logHTML + footerHTML;

  drawTimelineChart(cycles);
  drawOverlayChart(cycles);
}

// ── Shared chart options helpers ───────────────────────────────────────────

function yRange(temps) {
  const valid = temps.flat().filter(Boolean);
  if (!valid.length) return { min: 97.0, max: 99.0 };
  return {
    min: Math.floor((Math.min(...valid) - 0.25) * 4) / 4,
    max: Math.ceil( (Math.max(...valid) + 0.25) * 4) / 4,
  };
}

function baseOptions(xTicks, yMinMax, tooltipExtra) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: tooltipExtra || {} },
    },
    scales: {
      x: {
        ticks: { font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 18, ...xTicks },
        grid: { color: 'rgba(0,0,0,0.04)' },
      },
      y: {
        ...yMinMax,
        ticks: { font: { size: 11 }, callback: v => v.toFixed(2) },
        grid: { color: 'rgba(0,0,0,0.06)' },
      },
    },
  };
}

// Chart.js is the app's one external dependency, loaded from a CDN. Cold-start
// offline it may simply be absent, and `new Chart(...)` would then throw AFTER
// #app was written — which is the ca4a failure exactly: a drawn dashboard,
// renderPayload throwing past it, and failLoad replacing the lot with an error
// screen. Every caller of the two draw functions goes through this instead.
function chartsUnavailable() {
  if (typeof Chart !== 'undefined') return false;
  for (const id of ['chartTimeline', 'chartOverlay']) {
    const c = document.getElementById(id);
    if (c && c.parentNode) {
      c.parentNode.className = 'chart-missing';
      c.parentNode.innerHTML = 'These charts need an internet connection to load.';
    }
  }
  console.warn('Chart.js did not load — the dashboard was drawn without its charts.');
  return true;
}

// ── Chart 1: Full timeline ─────────────────────────────────────────────────

function drawTimelineChart(cycles) {
  if (chartsUnavailable()) return;
  if (timelineChart) { timelineChart.destroy(); timelineChart = null; }

  const allRows = cycles.flat();
  const labels  = allRows.map(r => r.Date);
  const temps   = allRows.map(r => r.Temp ? parseFloat(r.Temp) : null);

  // Per-cycle coverline: calculated value for cycles with an ovulation marker, null otherwise.
  // Chart.js with spanGaps:false will draw a separate segment per cycle automatically.
  const clLine = cycles.flatMap(cycle => {
    const cl = calcCoverline(cycle);
    return cycle.map(() => cl);
  });

  const ptColors = allRows.map(r =>
    phaseTag(r) === 'Blood'     ? '#e53935' :
    phaseTag(r) === 'Ovulation' ? '#ab47bc' : '#1e88e5'
  );
  const ptSizes = allRows.map((r, i) => {
    if (!r.Temp) return 0;
    if (phaseTag(r)) return 3.5;
    // Isolated only if there's no data to connect to anywhere on either side
    // (gaps are bridged with a dashed line below, so a point only needs a
    // dot if it truly has nothing to connect to).
    const isIsolated = !temps.slice(0, i).some(v => v != null) && !temps.slice(i + 1).some(v => v != null);
    return isIsolated ? 2.5 : 0;
  });

  // Dashed bridge datasets: one per gap, connecting the days on either side
  // of missing entries with a dotted line instead of a solid connection.
  const gapBridges = [];
  let prevIdx = -1;
  for (let j = 0; j < temps.length; j++) {
    if (temps[j] == null) continue;
    if (prevIdx >= 0 && j - prevIdx > 1) {
      const bridge = new Array(temps.length).fill(null);
      bridge[prevIdx] = temps[prevIdx];
      bridge[j] = temps[j];
      gapBridges.push({
        label: `__gap_${prevIdx}__`,
        data: bridge,
        borderColor: '#1e88e5',
        borderWidth: 2,
        borderDash: [5, 5],
        pointRadius: 0,
        spanGaps: true,
        tension: 0,
        fill: false,
        order: 1,
      });
    }
    prevIdx = j;
  }

  // Moon strip: a glyph in the reserved band above the plot, drawn on each day
  // the phase bucket turns over. Spacing is enforced in pixels, so a long
  // timeline thins itself out instead of overlapping into mush.
  const moonStripPlugin = {
    id: 'moonStrip',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const y = chartArea.top - 15;
      const minGap = 30;
      let lastIndex = null, lastX = -Infinity;

      ctx.save();
      // Emoji fonts first: if a monochrome outline glyph gets picked instead,
      // it renders as a faint hard-to-read shape rather than a filled moon.
      ctx.font = '17px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      allRows.forEach((r, i) => {
        const m = moonPhase(r._date);
        if (!m) return;
        const changed = m.index !== lastIndex;
        lastIndex = m.index;
        if (!changed) return;
        const x = scales.x.getPixelForValue(i);
        if (x - lastX < minGap) return;
        lastX = x;
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        ctx.fillRect(x - 0.5, chartArea.top, 1, 5);
        // Reset to full opacity before the glyph — a monochrome fallback would
        // otherwise inherit the tick's faded fill.
        ctx.fillStyle = '#37474f';
        ctx.fillText(m.glyph, x, y);
      });
      ctx.restore();
    },
  };

  // draw cycle separator lines via vertical annotations approximated with segment colors
  const { min, max } = yRange([temps]);

  timelineChart = new Chart(document.getElementById('chartTimeline').getContext('2d'), {
    type: 'line',
    plugins: [moonStripPlugin],
    data: {
      labels,
      datasets: [
        {
          label: 'Temp',
          data: temps,
          borderColor: '#1e88e5',
          borderWidth: 2,
          pointBackgroundColor: ptColors,
          pointBorderColor: ptColors,
          pointRadius: ptSizes,
          pointHoverRadius: 7,
          tension: 0.2,
          spanGaps: false,
          fill: false,
          order: 1,
        },
        {
          label: 'Divider',
          data: clLine,
          borderColor: '#9e9e9e',
          borderWidth: 1.5,
          borderDash: [5, 5],
          pointRadius: 0,
          fill: false,
          order: 2,
        },
        ...gapBridges,
      ],
    },
    options: {
      // Top padding reserves an empty band for the moon strip so it can never
      // collide with the temperature line.
      layout: { padding: { top: 28 } },
      ...baseOptions({}, { min, max }, {
        title: (items) => labels[items[0].dataIndex],
        afterBody: (items) => {
          const r = allRows[items[0].dataIndex];
          if (!r) return [];
          const moon = moonPhase(r._date);
          return [
            moon ? `Moon: ${moon.glyph} ${moon.name}` : '',
            phaseTag(r) ? `Phase: ${phaseTag(r)}` : '',
            r['Cervical Mucus'] ? `Mucus: ${r['Cervical Mucus']}` : '',
            r['Cervix Texture'] ? `Cervix: ${r['Cervix Texture']}` : '',
            r.Breasts ? `Breasts: ${r.Breasts}` : '',
            r.Note ? `Note: ${r.Note}` : '',
          ].filter(Boolean);
        },
      }),
    },
  });
}

// ── Chart 2: Cycle overlay ─────────────────────────────────────────────────

// Every cell here is sheet text, and since ca5 some of it is text Mike typed
// into this app minutes earlier. A Note containing "<" broke the table before
// this; escHTML is the same guard daySummary() already uses on the same values.
function buildLogRows(cycle) {
  return cycle.map(r => {
    const c = k => escHTML(r[k] || '');
    const empty = !hasData(r);
    const tag      = phaseTag(r);
    const rowClass = tag === 'Blood' ? 'row-blood' : tag === 'Ovulation' ? 'row-ovul' : empty ? 'row-empty' : '';
    const cycleTag = tag === 'Blood'
      ? '<span class="tag tag-blood">Blood</span>'
      : tag === 'Ovulation'
      ? '<span class="tag tag-ovul">Ovulation</span>'
      : '';
    return `<tr class="${rowClass}">
      <td>${c('Day')}</td>
      <td style="white-space:nowrap">${c('Date')}</td>
      <td style="white-space:nowrap">${r.Temp ? parseFloat(r.Temp).toFixed(2) + '&deg;' : '&mdash;'}</td>
      <td class="hide-sm" style="white-space:nowrap">${c('Time')}</td>
      <td>${c('Flow')}</td>
      <td class="hide-sm">${c('Cervix Texture')}</td>
      <td class="hide-sm">${c('Cervix Position')}</td>
      <td class="hide-sm">${c('Cervical Mucus')}</td>
      <td class="hide-sm">${c('Breasts')}</td>
      <td>${c('Temp Quality')}</td>
      <td>${r.Exclude === 'TRUE' ? 'yes' : ''}</td>
      <td>${cycleTag}</td>
      <td class="wrap">${c('Note')}</td>
    </tr>`;
  }).join('');
}

function onLogCycleChange(val) {
  selectedLogCycle = parseInt(val);
  document.getElementById('logTableBody').innerHTML = buildLogRows(allCycles[selectedLogCycle]);
}

function drawOverlayChart(cycles) {
  if (chartsUnavailable()) return;
  if (overlayChart) { overlayChart.destroy(); overlayChart = null; }

  const colors  = ['#1e88e5', '#e53935', '#fb8c00', '#43a047', '#8e24aa'];
  const maxLen  = Math.max(...cycles.map(c => c.length));
  const labels  = Array.from({ length: maxLen }, (_, i) => i + 1);

  // Ovulation band data: one entry per cycle that has a confirmed ovulation day
  const ovBands = cycles.map((cycle, i) => {
    const ovIdx = cycle.findIndex(isOv);
    return ovIdx >= 0 ? { idx: ovIdx, color: colors[i % colors.length], datasetIndex: i } : null;
  }).filter(Boolean);

  // Main line datasets never bridge gaps themselves (spanGaps:false) — real
  // consecutive days draw a solid line. Bridged gaps are drawn separately
  // below as dedicated dashed mini-segments, so the two never conflict.
  const mainDatasets = cycles.map((cycle, i) => {
    const lastTempIdx = cycle.reduce((max, r, j) => r.Temp ? j : max, -1);
    const display = lastTempIdx >= 0 ? cycle.slice(0, lastTempIdx + 1) : cycle;

    const data = labels.map((_, j) => {
      const row = display[j];
      return row && row.Temp ? parseFloat(row.Temp) : null;
    });

    // Red dot for blood days, cycle color otherwise
    const ptColors = labels.map((_, j) => {
      const row = cycle[j];
      return (row && phaseTag(row) === 'Blood') ? '#e53935' : colors[i % colors.length];
    });
    const ptSizes = labels.map((_, j) => {
      const row = display[j];
      if (!row || !row.Temp) return 0;
      if (cycle[j] && phaseTag(cycle[j]) === 'Blood') return 3.5;
      // Isolated only if there's no data to connect to anywhere on either
      // side (gaps are always bridged with a dashed line below).
      const isIsolated = !data.slice(0, j).some(v => v != null) && !data.slice(j + 1).some(v => v != null);
      return isIsolated ? 2.5 : 0;
    });

    return {
      label: cycle[0]?.Date || `Cycle ${i + 1}`,
      data,
      borderColor: colors[i % colors.length],
      borderWidth: 2,
      pointRadius: ptSizes,
      pointHoverRadius: 6,
      pointBackgroundColor: ptColors,
      pointBorderColor: ptColors,
      tension: 0.2,
      spanGaps: false,
      fill: false,
      _data: data,
      _cycleIndex: i,
    };
  });

  // Dashed bridge datasets: one per gap (pair of points with missing days between them)
  const bridgeDatasets = [];
  {
    mainDatasets.forEach((ds, i) => {
      const data = ds._data;
      let prev = -1;
      for (let j = 0; j < data.length; j++) {
        if (data[j] == null) continue;
        if (prev >= 0 && j - prev > 1) {
          const bridge = new Array(data.length).fill(null);
          bridge[prev] = data[prev];
          bridge[j] = data[j];
          bridgeDatasets.push({
            label: `__gap_${i}_${prev}__`,
            data: bridge,
            borderColor: colors[i % colors.length],
            borderWidth: 2,
            borderDash: [5, 5],
            pointRadius: 0,
            spanGaps: true,
            tension: 0,
            fill: false,
            _isBridge: true,
            _cycleIndex: i,
          });
        }
        prev = j;
      }
    });
  }

  const datasets = [...mainDatasets, ...bridgeDatasets];

  const allTemps = cycles.flatMap(c => c.map(r => r.Temp ? parseFloat(r.Temp) : null));
  const { min, max } = yRange([allTemps]);

  // Inline plugin to draw vertical ovulation bands behind the data
  const ovBandPlugin = {
    id: 'ovBands',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      ctx.save();
      const tickWidth = maxLen > 1
        ? Math.abs(scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0))
        : 20;

      // Group bands by day index, skipping hidden datasets
      const byDay = {};
      ovBands.forEach(b => {
        if (chart.getDatasetMeta(b.datasetIndex).hidden) return;
        if (!byDay[b.idx]) byDay[b.idx] = [];
        byDay[b.idx].push(b.color);
      });

      Object.entries(byDay).forEach(([idx, colors]) => {
        const xCenter = scales.x.getPixelForValue(Number(idx));
        const sliceW = tickWidth / colors.length;
        colors.forEach((color, ci) => {
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = color;
          ctx.fillRect(
            xCenter - tickWidth / 2 + ci * sliceW,
            chartArea.top,
            sliceW,
            chartArea.bottom - chartArea.top
          );
        });
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  };

  overlayChart = new Chart(document.getElementById('chartOverlay').getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    plugins: [ovBandPlugin],
    options: {
      ...baseOptions(
        { callback: (_, i) => i + 1 },
        { min, max },
        {
          title: (items) => `Day ${items[0].dataIndex + 1}`,
          afterBody: (items) => {
            return cycles.map((c) => {
              const row = c[items[0].dataIndex];
              if (!row || !row.Temp) return '';
              return `${row.Date}: ${parseFloat(row.Temp).toFixed(2)}°${phaseTag(row) ? ' (' + phaseTag(row) + ')' : ''}`;
            }).filter(Boolean);
          },
        }
      ),
      plugins: {
        ...baseOptions({}, {}, {}).plugins,
        legend: {
          display: true,
          labels: {
            font: { size: 11 }, boxWidth: 14, padding: 12,
            filter: (item, data) => !data.datasets[item.datasetIndex]._isBridge,
          },
          onClick: (e, legendItem, legend) => {
            const chart = legend.chart;
            const cycleIndex = legendItem.datasetIndex;
            const meta = chart.getDatasetMeta(cycleIndex);
            meta.hidden = meta.hidden === null ? !chart.data.datasets[cycleIndex].hidden : !meta.hidden;
            chart.data.datasets.forEach((ds, i) => {
              if (ds._isBridge && ds._cycleIndex === cycleIndex) {
                chart.getDatasetMeta(i).hidden = meta.hidden;
              }
            });
            chart.update();
          },
        },
      },
    },
  });

  // Default view: only the current cycle's line; past cycles start hidden.
  if (!overlayShowFull) {
    const currentCycleIndex = cycles.length - 1;
    datasets.forEach((ds, i) => {
      const belongsToCurrent = ds._isBridge ? ds._cycleIndex === currentCycleIndex : i === currentCycleIndex;
      if (!belongsToCurrent) overlayChart.getDatasetMeta(i).hidden = true;
    });
    overlayChart.update();
  }
}
