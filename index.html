// The sheet is private. All reads go through an Apps Script web app that
// checks a token before it touches the sheet. Paste the /exec URL of your
// deployment here — see Apps Script/SETUP.md.
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxmV4lU0JN1CjiUXlZ9B4FBWGGz9yGA5TJiGBe-Am_HNxblQERYZgw-9csv9LjeA7QD/exec';

const TOKEN_KEY = 'cycleToken';
// The display cache lives in its own key so a quota failure can be recovered
// by dropping it alone, never by touching the access token.
const CACHE_KEY = 'cycleCache';
// One self-reload per tab, so a genuinely dead server cannot loop the page.
const REFRESH_KEY = 'cycleSelfRefreshed';
// Which link this is. The display cache carries the role too, but ca7 and ca6
// both drop that whole key to make room — and then a cold start with no signal
// no longer knows whether it is Mike or Tirzah, so it cannot decide whether to
// offer the Log tab. This key is a few bytes and survives that.
const ROLE_KEY = 'cycleRole';

let _lastMessage = null;   // the last showMessage() args, so redraw() can repeat it

let _staleInfo      = null;   // set while the screen is drawn from the cache
let _bannerDismissed = false;
let _loadedOk        = false; // a live read has succeeded in this session
let _provisional     = false; // on screen from the cache, live read still in flight
let _tokenPersisted  = false; // the store accepted the token, so the address bar may be scrubbed

// The token arrives once, in the URL fragment (#t=...). Text after "#" is
// never sent to any server, so it stays out of logs and out of Referer
// headers. Store it, then scrub the address bar so a screenshot or a shared
// link does not leak it — but only once the store has actually accepted it.
function bootstrapToken() {
  let token = '';
  const m = /[#&]t=([^&]*)/.exec(location.hash);
  if (m) {
    token = decodeURIComponent(m[1]).trim();
    try {
      localStorage.setItem(TOKEN_KEY, token);
      _tokenPersisted = true;
    } catch (e) {
      // Usually quota, and the display cache is the only large thing we store.
      // Losing the offline copy beats losing access, so drop it and try again
      // before telling the user they are stuck.
      try {
        localStorage.removeItem(CACHE_KEY);
        localStorage.setItem(TOKEN_KEY, token);
        _tokenPersisted = true;
        console.warn('Storage was full — the saved copy of the data was dropped to keep the access link.');
      } catch (e2) {
        // Private mode, or storage blocked. The fragment below is deliberately
        // NOT scrubbed in this case — it is the only copy of the token left,
        // and an app that cannot be reopened is worse than one whose URL is
        // visible in a screenshot. (Mike's call, 2026-09-15.)
        console.error('Could not save the access token:', e, e2);
        alert('Your access link worked, but this browser would not save it. ' +
              'Keep this page’s web address — it still holds your link, ' +
              'and you will need it to open the app again.');
      }
    }
    // Scrubbing an unsaved token would lock the user out on the next reload.
    if (_tokenPersisted) history.replaceState(null, '', location.pathname + location.search);
  }
  if (!token) {
    try {
      token = localStorage.getItem(TOKEN_KEY) || '';
      if (token) _tokenPersisted = true;
    }
    catch (e) { console.error('Could not read the saved access token:', e); }
  }
  // Ask Chrome not to evict the token under storage pressure. Advisory only,
  // and only meaningful once we actually have something worth keeping.
  if (token && navigator.storage && navigator.storage.persist) {
    navigator.storage.persist()
      .then(ok => { if (!ok) console.warn('Storage is not persistent — the token may be evicted.'); })
      .catch(e => console.warn('storage.persist() failed:', e));
  }
  return token;
}

const TOKEN = bootstrapToken();

// The queue banner goes above every message screen too. With no cache and no
// signal there is no render() at all, and unsent entries would be on no screen.
//
// ca9: so does the tab bar, and so does the Log tab itself. A cold start with no
// signal and no saved copy lands here, and it is the one situation the unsent
// queue exists for — a writer who cannot reach the entry form cannot use it.
// entryScreenHTML() needs no cycle data: with none, every day is "not logged"
// and carries no day number, which is exactly true. The Dashboard tab has
// genuinely nothing to draw, so it stays the message.
function showMessage(msg, detail, canRetry) {
  _lastMessage = { msg: msg, detail: detail, canRetry: canRetry };
  if (_tab === 'log' && _role === 'writer') {
    document.getElementById('app').innerHTML =
      queueBannerHTML() + tabBarHTML() + entryScreenHTML(allCycles || []);
    return;
  }
  const esc = escHTML;
  document.getElementById('app').innerHTML = queueBannerHTML() + tabBarHTML() + `
    <div class="spinner">
      ${esc(msg)}<br>
      ${detail ? `<small>${esc(detail)}</small><br>` : ''}
      ${canRetry ? '<button onclick="loadData()">Retry</button>' : ''}
    </div>`;
}

function showError(msg) { showMessage('Could not load data.', msg, true); }

// >>> ADAPTER — extracted and executed verbatim by Tools/verify-proxy.js, which
// matches on these two marker lines. Keep them, and keep this block free of
// anything that only exists in a browser.
//
// The new sheet has no Day column; ca2 replaced it with a Date and a Cycle
// Start flag, so the day number is synthesised here, at the parse boundary.
// ca3 also synthesised a Cycle column; ca4 deleted it — every reader now goes
// through isOv() / isBleeding() / phaseTag() in the SAFETY block instead.
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// A row the adapter throws away, or a yes/no column it cannot read, moves the
// cycle day and therefore the safety verdict. Nobody ever sees a console
// warning on a phone, so collect them here and let ca7's banner show them too.
// renderPayload() clears this before every parse.
let _dataWarnings = [];
function warn(msg) { _dataWarnings.push(msg); console.warn(msg); }

// Sheets turns a ticked checkbox into a boolean and the proxy flattens that to
// 'TRUE'. A value typed by hand is just as deliberate, so accept the obvious
// spellings — and shout about anything else instead of reading it as blank. A
// Cycle Start that silently fails to register merges two cycles, which moves
// the cycle day and therefore the safety window.
const TRUTHY = new Set(['TRUE', 'YES', 'Y', 'X', '1']);

function flag(v, col, date) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (TRUTHY.has(s.toUpperCase())) return 'TRUE';
  warn(`${date}: ${col} holds "${s}", which is not a yes/no value — it was read as not set.`);
  return '';
}

function adaptRows(rows) {
  let cycleStart = null;
  const out = [];
  for (const r of rows) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(r.Date || '').trim());
    if (!m) { warn(`A row dated "${r.Date}" could not be read and was left out.`); continue; }
    // Local midnight at both ends, so the day difference is exact and immune to DST.
    const d = new Date(+m[1], +m[2] - 1, +m[3]);

    const row = Object.assign({}, r);
    // Normalise the three yes/no columns here, once, so no downstream reader
    // has to guess at a spelling.
    row['Cycle Start'] = flag(r['Cycle Start'], 'Cycle Start', r.Date);
    row.Ovulation      = flag(r.Ovulation, 'Ovulation', r.Date);
    row.Exclude        = flag(r.Exclude, 'Exclude', r.Date);
    // A day marked both is BOTH, now that the rules read the two columns
    // independently: it anchors the safe window and counts in the opening bleed
    // run, while the log table shows only "Ovulation". Say so rather than let
    // one observation quietly do two jobs. (ca3 warned here too; ca4 dropped it
    // along with the synthesised Cycle column. ca4a puts it back.)
    if (row.Ovulation === 'TRUE' && String(r.Flow || '').trim().toLowerCase() === 'bleeding') {
      warn(`${r.Date}: marked both Ovulation and bleeding — it counts as both.`);
    }
    if (row['Cycle Start'] === 'TRUE') cycleStart = d;
    row._date = d;
    // Display format matches what the old sheet's formatted cells gave, so no
    // surface Tirzah sees changes in this slice.
    row.Date = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    // Rows before the first Cycle Start get no day number and are filtered out
    // below, exactly as unnumbered rows were before.
    row.Day = cycleStart ? String(Math.round((d - cycleStart) / 86400000) + 1) : '';
    out.push(row);
  }
  return out;
}
// <<< ADAPTER

let _scriptEl = null;
let _loadTimer = null;

// Stored with the proxy URL it came from, for the reason cacheIsUsable() checks
// the same thing: a new deployment is a new pair of tokens, and the old link may
// not mean what it did.
function rememberRole(role) {
  try {
    if (role) localStorage.setItem(ROLE_KEY, PROXY_URL + '\n' + role);
    else localStorage.removeItem(ROLE_KEY);
  } catch (e) { console.error('Could not save which kind of link this is:', e); }
}

function recallRole() {
  try {
    const v = String(localStorage.getItem(ROLE_KEY) || '').split('\n');
    return v.length === 2 && v[0] === PROXY_URL && v[1] ? v[1] : null;
  } catch (e) { console.error('Could not read which kind of link this is:', e); return null; }
}

function readCache() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }
  catch (e) { console.error('The saved copy of the data could not be read:', e); }
  return cacheIsUsable(c, PROXY_URL) ? c : null;
}

function writeCache(cols, rows, role) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ proxy: PROXY_URL, at: Date.now(), role: role || null, cols: cols, rows: rows }));
  } catch (e) {
    // Full, blocked, or private mode. Drop only our own key — the access token
    // shares this storage and losing it would lock the user out entirely.
    console.error('Could not save a copy of the data for offline use:', e);
    try { localStorage.removeItem(CACHE_KEY); } catch (e2) { console.error(e2); }
  }
}

// The one place rows become a rendered dashboard, so the cached path and the
// live path cannot drift apart.
function renderPayload(cols, rows) {
  const objs = rows.map(cells => {
    const obj = {};
    cols.forEach((c, i) => { obj[c] = cells[i] == null ? '' : String(cells[i]); });
    return obj;
  });
  _dataWarnings = [];
  const filtered = adaptRows(objs).filter(r => r.Day && /^\d+$/.test(r.Day.trim()));
  const cycles   = splitCycles(filtered);
  if (cycles.length === 0) throw new Error('No cycle data found in sheet');
  render(cycles);
}

// A failed read is not evidence the data changed — Google's /exec redirect
// intermittently 404s. Fall back to the last good copy and say how old it is,
// rather than replacing a working dashboard with an error screen. Staleness is
// therefore driven by the age of the last SUCCESSFUL read, never by one failure.
function failLoad(msg) {
  const c = readCache();
  if (c) {
    try {
      _staleInfo = { at: c.at };
      _provisional = false;
      _bannerDismissed = false;   // a new failure always brings the banner back
      if (_role === null) _role = c.role || null;
      renderPayload(c.cols, c.rows);
      return;
    } catch (e) {
      console.error('The saved copy of the data could not be rendered:', e);
      _staleInfo = null;
    }
  }
  showError(msg);
}

// A redeploy leaves viewers holding a cached page that points at the previous
// /exec. Google answers an archived /exec with an HTTP 200 error page, so the
// script tag "loads", onerror never fires and the callback never runs — the 20s
// timeout is the only symptom. Reload the page itself past the browser cache.
// manifest.json's start_url means a "?v=" typed in the address bar never reaches
// an installed icon, so this has to happen from inside the page.
function selfRefresh() {
  if (_loadedOk) return false;   // the URL is demonstrably fine; don't yank the page
  try {
    if (sessionStorage.getItem(REFRESH_KEY)) return false;
    sessionStorage.setItem(REFRESH_KEY, '1');
  } catch (e) {
    console.warn('Could not record a self-refresh, so none was attempted:', e);
    return false;
  }
  console.warn('No reply in 20s on a first load \u2014 reloading the app past the browser cache.');
  showMessage('Still loading\u2026', 'Fetching the latest version of the app.', false);
  // location.hash is empty once the token is saved, and still holds "#t=" when
  // it could not be. Carry it either way, or this reload is the thing that
  // loses an unsaved token.
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  return true;
}

function loadData(attempt) {
  attempt = attempt || 1;
  if (!PROXY_URL) {
    return showMessage('This app is not finished being set up.',
      'No data source is configured yet.', false);
  }
  if (!TOKEN) {
    return showMessage('No access.',
      'This app needs a personal link to open. Ask Mike to send you yours.', false);
  }

  if (_scriptEl && _scriptEl.parentNode) _scriptEl.parentNode.removeChild(_scriptEl);
  clearTimeout(_loadTimer);

  const done = () => { clearTimeout(_loadTimer); window._sheetCallback = () => {}; };

  window._sheetCallback = function(resp) {
    done();
    try {
      if (!resp || resp.ok !== true) {
        const err = resp && resp.error;
        // Access and setup problems get their own message, never a cached
        // dashboard pretending to be live — and never the Log tab either. The
        // server has just said this link is not a working writer link, so a
        // remembered role from an earlier session is wrong and must go, or
        // showMessage() would draw the entry form over the refusal.
        if (err === 'not-configured' || err === 'no-access') {
          _role = null; _tab = 'dashboard'; rememberRole(null);
        }
        if (err === 'not-configured') {
          return showMessage('This app is not finished being set up.',
            'The server has no access tokens configured yet.', false);
        }
        if (err === 'no-access') {
          return showMessage('This link is not valid any more.',
            'Ask Mike for a new one.', false);
        }
        throw new Error(err || 'The server sent a response this app could not read');
      }
      // A valid reply proves PROXY_URL is live, so record that before rendering
      // — a render failure is a data problem, not a reason to reload the app.
      _loadedOk = true;
      _staleInfo = null;
      _provisional = false;
      _role = resp.role || null;
      rememberRole(_role);
      renderPayload(resp.cols, resp.rows);
      // Only cache what actually rendered, so a bad payload cannot overwrite a
      // good saved copy and leave the offline path broken too.
      writeCache(resp.cols, resp.rows, resp.role);
      // A read got through, so the signal is back: try the unsent entries. Not
      // awaited — the dashboard is already drawn and the flush redraws itself.
      flushQueue();
    } catch (e) {
      console.error(e);
      failLoad(e.message);
    }
  };

  _scriptEl = document.createElement('script');
  _scriptEl.onerror = () => {
    done();
    // A 404 from the flaky redirect errors fast, so a retry costs a second, not
    // twenty. The 20s timeout below is a different failure and is not retried.
    if (attempt < 3) {
      console.warn(`The sheet did not answer (attempt ${attempt}) — retrying.`);
      return setTimeout(() => loadData(attempt + 1), attempt * 800);
    }
    failLoad('Could not reach the server — check your internet connection');
  };
  _scriptEl.src = `${PROXY_URL}?t=${encodeURIComponent(TOKEN)}&callback=_sheetCallback`;
  // JSONP reports nothing when a request simply never comes back. Without this
  // the app sits on the spinner forever and nobody is told anything.
  _loadTimer = setTimeout(() => {
    done();
    // Say only what is known: no reply arrived. The old wording blamed the
    // daily quota, which sent Mike hunting a quota that was fine on 2026-09-14
    // when the real cause was a cached page pointing at an archived /exec.
    if (selfRefresh()) return;
    failLoad('The server did not reply within 20 seconds.');
  }, 20000);
  document.head.appendChild(_scriptEl);
}

// Draw the saved copy before the read, not instead of it. Anything that could
// be wrong by a day or two shows immediately; the safety verdict waits.
function bootFromCache() {
  const c = readCache();
  if (!c) return;
  try {
    _provisional = true;
    // Not an overwrite: recallRole() may already have answered this, and the
    // cache is the one of the two that ca7 is allowed to throw away.
    _role = c.role || _role;
    renderPayload(c.cols, c.rows);
  } catch (e) {
    // A saved copy this version cannot render is not worth a word to the user —
    // the live read is already on its way and will replace it either way. Loud
    // in the console, silent on screen.
    console.error('The saved copy could not be drawn at startup:', e);
    _provisional = false;
  }
}

// The offline shell. Without sw.js the app cannot be OPENED with no signal —
// Chrome serves index.html from its own HTTP cache or shows its offline page,
// and everything below is unreachable in exactly the case it was built for.
// `window.isSecureContext` covers https and localhost and excludes file://,
// where registration would throw. Failing to install is not fatal — the app
// still works online — but it is the whole of this feature, so it is loud.
if (window.isSecureContext && navigator.serviceWorker) {
  navigator.serviceWorker.register('sw.js')
    .catch(e => console.error('The offline shell could not be installed — ' +
      'this app will not open without a signal:', e));
}

// Before either render: the catch-up cards and the banner both read the queue,
// and an unsent entry must be on screen from the very first paint.
loadQueue();
// Before bootFromCache(), which only fills this in if it is still empty. With no
// cache and no signal this is the only thing that knows whose link this is, and
// therefore the only thing that can put the Log tab on the error screen.
_role = recallRole();
bootFromCache();
loadData();
// The one moment worth reacting to instantly. Everything else waits for the
// next read; this is the flush Mike is standing there waiting for.
window.addEventListener('online', () => { console.warn('Back online — flushing.'); flushQueue(); });
// The refresh re-renders from scratch, which would wipe a half-typed entry.
// A day being edited is unsaved work; the dashboard can wait ten more minutes.
//
// But a card left open pauses the refresh for as long as it stays open, and the
// staleness banner and the safety verdict go quiet with it. Re-rendering over
// the form is still the wrong answer — so after half an hour, say so IN the form,
// which is the one place the person who left it open is looking.
const REFRESH_MS = 10 * 60 * 1000;
const REFRESH_NAG_AFTER = 3;   // skips, i.e. 30 minutes
setInterval(() => {
  if (_openDate) {
    _skippedRefreshes++;
    const mins = Math.round(_skippedRefreshes * REFRESH_MS / 60000);
    console.warn(`Refresh skipped: an entry is open (${mins} minutes now).`);
    if (_skippedRefreshes >= REFRESH_NAG_AFTER) {
      setHint(`This day has been open ${mins} minutes, so nothing on the dashboard — ` +
              `including the safety status — has refreshed since. Save or close it to catch up.`);
    }
    return;
  }
  _skippedRefreshes = 0;
  loadData();
}, REFRESH_MS);
</script>
